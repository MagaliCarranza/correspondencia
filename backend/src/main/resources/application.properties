spring.application.name=correspondencia

# Perfil activo por defecto (se sobrescribe con SPRING_PROFILES_ACTIVE)
spring.profiles.active=dev

# JPA / Hibernate: config compartida entre perfiles
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway: migraciones versionadas del esquema
# baseline-on-migrate=true permite tratar una BD ya existente como baseline (V1)
# sin re-ejecutar el script inicial. Los cambios futuros se aplican con V2, V3, etc.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema inicial (baseline)

# Parametros de negocio propios (leidos con @Value o @ConfigurationProperties)
correspondencia.seguridad.max-intentos-login=5
correspondencia.seguridad.jwt-expiracion-minutos=120
# Secreto por defecto solo para dev - en prod SIEMPRE vía variable de entorno CORRESPONDENCIA_SEGURIDAD_JWT_SECRETO
correspondencia.seguridad.jwt-secreto=${CORRESPONDENCIA_SEGURIDAD_JWT_SECRETO:desarrollo-cambia-este-secreto-en-produccion-por-favor-32chars}
# Origenes permitidos para CORS. Acepta varios separados por coma.
# Ej.: CORRESPONDENCIA_SEGURIDAD_CORS_ORIGINS=https://prod.midominio.com,https://staging.midominio.com
correspondencia.seguridad.cors-origins=${CORRESPONDENCIA_SEGURIDAD_CORS_ORIGINS:http://localhost:5173}
