# En Railway la BD llega como DATABASE_URL o como variables sueltas
# Recomendado: definir SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# En produccion nunca modificar el esquema automaticamente
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Railway asigna el puerto por variable PORT
server.port=${PORT:8080}

# Logging conservador en produccion
logging.level.root=INFO
logging.level.com.magali.correspondencia=INFO
