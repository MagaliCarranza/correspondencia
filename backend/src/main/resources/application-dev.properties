# Conexion a PostgreSQL local (docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5433/correspondencia
spring.datasource.username=correspondencia
spring.datasource.password=correspondencia
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway gestiona el esquema; Hibernate solo verifica que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging mas detallado en desarrollo
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.magali.correspondencia=DEBUG

# Puerto local
server.port=8080
